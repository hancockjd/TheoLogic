<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page not found — Theo Logic, LLC</title>
<meta name="theme-color" content="#07080A">
<meta name="color-scheme" content="dark">

<!-- ============================================================
     DELIBERATELY SELF-CONTAINED — do not add external <link> or <img>.
     ------------------------------------------------------------
     A host serves this file for ANY unmatched path, but the browser still
     resolves relative URLs against the path that was requested. From
     /work/missing/, "assets/css/styles.css" would resolve to
     /work/missing/assets/css/styles.css and 404 in turn — leaving an unstyled
     error page. Root-absolute paths ("/assets/...") fix that on a custom domain
     but break on a GitHub Pages project URL, where the site is served from
     /<repo>/. Inlining the styles and the mark sidesteps both problems: this
     page renders correctly from any depth, on either host.

     Keep the palette below in sync with assets/css/styles.css :root by hand.
     ============================================================ -->
<style>
  /* The one external reference allowed here: if the font fails to load, the
     page still renders in the fallback serif. The path is root-absolute on
     purpose (see comment above) and follows the /TheoLogic/ project URL —
     change it with the home link when the custom domain goes live. */
  @font-face{
    font-family:"Playfair Display";
    src:url("/TheoLogic/assets/fonts/playfair-display-400.woff2") format("woff2");
    font-weight:400; font-style:normal; font-display:swap;
  }
  :root{
    --ink:#07080A; --paper:#F5F2EB; --muted:#99A0AA; --muted-2:#6C737D;
    --line:rgba(245,242,235,.10); --line-2:rgba(245,242,235,.18);
    --truth:#E7B54F; --logic:#7ECAD8;
    --serif:"Playfair Display","Didot","Bodoni 72",Georgia,"Times New Roman",serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
    --pad:clamp(20px,5vw,96px); --ease:cubic-bezier(.16,1,.3,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0; background:var(--ink); color:var(--paper); font-family:var(--sans);
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
    min-height:100svh; display:grid; place-items:center; text-align:center;
    padding:var(--pad);
  }
  a{color:inherit; text-decoration:none}
  :focus-visible{outline:2px solid var(--truth); outline-offset:3px; border-radius:2px}
  .glow{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(70% 55% at 50% 30%, rgba(231,181,79,.10), transparent 70%);
  }
  .inner{position:relative; z-index:1}
  .mark{width:44px; height:44px; margin:0 auto 34px; display:block}
  .code{
    font-family:var(--mono); font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--truth); margin:0 0 20px;
  }
  h1{
    font-family:var(--serif); font-weight:400; letter-spacing:-.015em; line-height:1.06;
    font-size:clamp(32px,5.2vw,64px); margin:0 0 18px;
  }
  p.lede{
    font-size:clamp(16px,1.4vw,20px); line-height:1.62; color:#CBD0D7;
    max-width:44ch; margin:0 auto 36px;
  }
  .btn{
    display:inline-flex; align-items:center; gap:10px; padding:15px 26px; border-radius:100px;
    font-family:var(--mono); font-size:11.5px; letter-spacing:.18em; text-transform:uppercase;
    background:var(--truth); color:#0A0906; border:1px solid var(--truth); font-weight:600;
    transition:.45s var(--ease);
  }
  .btn:hover{background:#F2C765; border-color:#F2C765; transform:translateY(-2px)}
  .btn .ar{transition:transform .45s var(--ease)}
  .btn:hover .ar{transform:translateX(4px)}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms !important; animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="inner">
  <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
    <circle cx="20" cy="20" r="18.5" stroke="#E7B54F" stroke-width="1"/>
    <path d="M8 14h24M20 14v20" stroke="#F5F2EB" stroke-width="1.4"/>
    <path d="M20 26 33 14" stroke="#7ECAD8" stroke-width="1.2"/>
  </svg>
  <p class="code">Error 404</p>
  <h1>This frame is empty.</h1>
  <p class="lede">The page you asked for does not exist, or it has moved. The work is still where you left it.</p>
  <!-- Currently served from the GitHub Pages PROJECT URL, where the site lives
       under /TheoLogic/. When a custom domain (CNAME) goes live at the root,
       change this back to "/". See README.md → Pre-launch checklist. -->
  <a href="/TheoLogic/" class="btn">Back to Theo Logic <span class="ar">&rarr;</span></a>
</main>
</body>
</html>
